# 対象のリポジトリに .github/workflows/pr-review.yml として置く。
name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 続けてpushしたときは、古いレビューを止めて最新の差分だけをレビューする
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # 再利用ワークフローの側でも同じ判定をするが、呼び出し側にも置いて、ジョブを起こさずに飛ばす
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    # <SHA> は pr-review のコミットのSHA。uses: と pr-review-ref に同じ値を書く
    uses: knk1313/pr-review/.github/workflows/review.yml@<SHA>
    with:
      pr-review-ref: <SHA>
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
